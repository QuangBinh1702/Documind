[project]
name = "documind"
version = "0.1.0"
description = "Nền tảng hỏi đáp tài liệu có trích dẫn nguồn"
requires-python = ">=3.12"

# Phiên bản ghim ở mức minor. Chốt chính xác bằng lock file khi cài lần đầu
# rồi cập nhật bảng công nghệ ở SPEC-v1.md §2 (bỏ chữ "đề xuất").
dependencies = [
    # ── API ────────────────────────────────────────────
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.36",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12",

    # ── Dữ liệu ────────────────────────────────────────
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3.6,<0.5",

    # ── Hàng đợi ───────────────────────────────────────
    "celery>=5.4,<6",
    "redis>=5.2,<7",

    # ── Lưu trữ tệp ────────────────────────────────────
    "minio>=7.2,<8",

    # ── Xác thực ───────────────────────────────────────
    "argon2-cffi>=23.1",
    "pyjwt>=2.10,<3",

    # ── Trích xuất tài liệu ────────────────────────────
    "pymupdf>=1.24,<2",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",

    # ── Tiếng Việt ─────────────────────────────────────
    "underthesea>=6.8",

    # ── Mô hình ngôn ngữ ───────────────────────────────
    # Cả hai adapter LLM đều gọi HTTP thẳng thay vì qua SDK riêng: Ollama và
    # vLLM nói giao thức OpenAI, Gemini có REST endpoint. Một phụ thuộc thay
    # cho hai SDK, và không phải chạy theo vòng đời phát hành của ai cả.
    "httpx>=0.28",
]

[project.optional-dependencies]
# Mô hình nặng — tách riêng để chạy test và phát triển API không cần tải 10 GB.
#   pip install -e ".[ml]"
ml = [
    "torch>=2.5",
    "FlagEmbedding>=1.3",
    "sentence-transformers>=3.3",
    "paddleocr>=3.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # RUF001/002/003 cảnh báo "ký tự Unicode dễ nhầm". Với một dự án xử lý văn
    # bản tiếng Việt, chúng báo động liên tục trên nội dung hoàn toàn có chủ ý:
    # NBSP và zero-width space là thứ normalize.py sinh ra để loại bỏ; ¸ × ñ ö
    # là mẫu thử bảng mã TCVN3/VNI; – ’ “ nằm trong danh sách dấu câu tiếng
    # Việt. Tắt hẳn thay vì rải noqa khắp nơi.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tên hàm test viết bằng tiếng Việt không dấu, cố ý dài để đọc như một câu.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # Assertion hiệu năng CHỈ chạy trên máy đích (SPEC.md US-057 AC-8).
    #   chạy thường:   pytest -m "not perf"
    #   trên server:   pytest -m perf
    "perf: mốc hiệu năng — chỉ có nghĩa trên máy đích 16 GB VRAM",
    "ml: cần mô hình đã tải về",
    "db: cần Postgres đang chạy",
]
addopts = "-m 'not perf' --strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
