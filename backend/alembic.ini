# Alembic configuration.
#
# NOTE: keep this file pure ASCII. Alembic reads it with encoding="locale",
# which is cp1252 on Windows, so non-ASCII characters raise UnicodeDecodeError.
# Vietnamese notes belong in alembic/env.py or the migration files instead.
#
# sqlalchemy.url is intentionally absent: env.py reads it from app.settings so
# there is a single source of configuration (SPEC.md DoD D7).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
